# Purpose and Context --------------------------------------------------------------------------------------------------
document.context.intro.vulnerability.report=This report applies context-specific evaluation metrics to the identified vulnerabilities. In the following sections essential details are provided supporting the conveyed evaluation results.
document.context.intro.periodic.report=This report applies context-specific evaluation metrics to the identified vulnerabilities in the period of interest. In the following sections essential details are provided supporting the conveyed evaluation results.
document.context.intro.summary.report=This report applies context-specific evaluation metrics to the identified vulnerabilities in the period of interest. In the following sections essential details are provided supporting the conveyed evaluation results.

document.purpose.intro.vulnerability=This ${document.type} details the identified vulnerabilities with the currently available assessment information. The vulnerabilities are listed and organized by their current status and further described with public available and assessment-related details.
document.purpose.intro.periodic=This ${document.type} provides a view on vulnerability and advisory data added or updated in a given period of interest. It details the subset of vulnerabilities affected by the changes in this timeframe.
document.purpose.intro.summary=This ${document.type} provides an overview on the vulnerability status in form of a summary. It provides statistics on the current status of evaluation.

document.notice.title=Notice
document.notice.trademarks.title=Names and Trademarks
document.notice.trademarks.text=All company names, organization names, and product names mentioned in this documentation are used for identification purposes only. A trademark is explicitly identified as registered or unregistered trademark only if required by appropriate guidelines or license terms.
document.notice.external.materials.title=External Vulnerability Materials
document.notice.external.materials.text.1=Materials - including data, content, and references - covering vulnerability information from external sources are presented in this documentation 'AS IS'. #[[${organization.name}]]# does not claim any copyright on the included external materials nor is #[[${organization.name}]]# liable for the correctness and completeness of the presented external materials. Materials from external sources are included herein for informational purposes only. #[[${organization.name}]]# is not responsible for the availability and content provided by external links.
document.notice.tpc.vulnerabilities.title=Third-Party Component Vulnerabilities
document.notice.tpc.vulnerabilities.text=The vulnerabilities enlisted within this document are primarily vulnerabilities of third-party software or hardware components that are included within or integrated with assets of #[[${organization.name}]]#. The fact that such a component is affected by a known vulnerability must not necessarily imply that assets are affected. To determine the relevance and potential risks, vulnerabilities are categorized and assessed within the context of the assets using or integrating the components.
document.notice.assessment.categories.title=Vulnerability Assessment Categories
document.notice.assessment.categories.intro=This report organizes vulnerabilities in three assessment categories:
document.notice.category.affected.title=Affected
document.notice.category.affected.desc=This category covers vulnerabilities that have been assessed were identified as vulnerabilities affecting one or more assets in scope.
document.notice.category.potentially.affected.title=Potentially Affected
document.notice.category.potentially.affected.desc=Vulnerabilities that have not yet been assessed are considered to potentially affect one or more assets in scope.
document.notice.category.not.affected.title=Not Affected
document.notice.category.not.affected.desc=In case a vulnerability does not have any impact on the assets in scope, the vulnerability is categorized to not affect the assets.
document.notice.assessment.categories.outro=These categorizes are used specifically in statistics and summaries.
document.notice.assessment.status.title=Vulnerability Assessment Status
document.notice.assessment.status.intro=On the individual level of a vulnerability in a specific usage, integration and deployment context the vulnerability assessment status can be determined:
document.notice.status.applicable.title=Applicable
document.notice.status.applicable.desc=A vulnerability is found to be included and to be potentially exploitable in the scope of an asset. In particular, no justification can be provided arguing that the vulnerability cannot be exploited.
document.notice.status.not.applicable.title=Not Applicable
document.notice.status.not.applicable.desc=A vulnerability is considered not applicable in case evidence can be provided, constituting the vulnerability either as not accessible or as not reachable in the context of an asset. Especially, vulnerabilities in functions or interfaces not in use or deactivated are considered not applicable.
document.notice.status.in.review.title=In Review
document.notice.status.in.review.desc=A vulnerability is in review in case assessment details are insufficient or not available.
document.notice.status.insignificant.title=Insignificant
document.notice.status.insignificant.desc=A vulnerability is regarded as insignificant in case the original severity does not exceed a predetermined score or a vulnerability has been assessed and is explicitly marked as insignificant in the given context. The status supports to prioritize assessments, while providing a comprehensive view.
document.notice.status.void.title=Void
document.notice.status.void.desc=Void vulnerabilities are vulnerabilities that have been reported and assessed for other versions of the assets considered in scope. Void vulnerabilities affect component versions that are not included in the current asset version. The affected components have either been patched or are not included in the currently provided assets. Void vulnerabilities are reported to provide continuity over a product's life cycle.
document.notice.assessment.steps.title=Vulnerability Assessment
document.notice.assessment.steps.intro=Identified vulnerabilities are assessed in six major steps:
document.notice.assessment.step.1=Correlation Verification - The identified components are automatically correlated with vulnerable products. The correlation may be false, incomplete, or imprecise. In the correlation verification step the automated mapping is reviewed and improved. Based on a precise vulnerable product correlation vulnerabilities can be queried more accurately.
document.notice.assessment.step.2=Applicability Check - Queried vulnerabilities are analyzed for applicability. Vulnerabilities that are not applicable are documented by providing an appropriate rationale. Furthermore, vulnerabilities can be degraded or escalated within the given categories.
document.notice.assessment.step.3=Context assessment - The vulnerabilities are reevaluated in the given context. CVSS environmental metric adjustments enable to recompute the CVSS severity score based on the given context.
document.notice.assessment.step.4=Avoidance Check - For applicable vulnerabilities alternatives or upgrade options are validated. When a defect causing the vulnerability is fixed by a newer version of the component, the update or upgrade options are evaluated within the current development and release timelines.
document.notice.assessment.step.5=Risk Assessment – Applicable vulnerabilities that cannot be immediately addressed by updating, upgrading or replacements are assessed to determine the imposed security risk. The vulnerability induced risk is described and counter measures for the asset in operation are evaluated and documented.
document.notice.assessment.step.6=Vulnerability Remediation - Based on the performed assessments the options for a remediation of the vulnerability are derived. These may vary significantly depending on the nature or impact of the vulnerability.
document.notice.severity.metrics.title=Vulnerability Severity Metrics
document.notice.severity.metrics.1=Generally, vulnerability severity is measured using the <abbreviated-form keyref="cvss"/> scoring system. Currently, two versions of the CVSS scoring system are commonly applied and supported by the NVD. This document uses both the CVSS version 2.0 and the CVSS versions 3.x.
document.notice.severity.metrics.2=In case a CVSS version 3.x vector is available all severity metrics are using this version. If no CVSS version 3.x vector is provided for a vulnerability, the severity metrics fall back to a CVSS version 2.0 vector, if available. The resulting metrics are used for computing scores, severity categorization, ordering and charting.
document.notice.severity.metrics.3=This approach is taken since CVSS version 3.x allows more fine-granular and therefore more differentiated assessments.
document.notice.severity.metrics.4=The report uses the default CVSS severity scheme as defined in the CVSS 3.1 specification:
document.notice.severity.scheme.title=CVSS Severity Scheme
document.notice.severity.table.header.1=Severity Rating
document.notice.severity.table.header.2=CVSS Score Range
document.notice.severity.table.header.3=Remarks
document.notice.severity.none.title=None
document.notice.severity.none.remarks=In the CVSS 2.0 specification 0.0 is included in severity rating Low.
document.notice.severity.low.title=Low
document.notice.severity.medium.title=Medium
document.notice.severity.high.title=High
document.notice.severity.high.remarks=In the CVSS 2.0 specification the severity rating Critical does not exist. CVSS scores from 7.0 to 10.0 are all rated as High.
document.notice.severity.critical.title=Critical
document.notice.severity.critical.remarks=In the CVSS 2.0 specification the severity rating Critical does not exist. CVSS scores from 7.0 to 10.0 are all rated as High.
document.notice.prioritization.title=Vulnerability Prioritization
document.notice.prioritization.text.1=The Vulnerability Priority Score automates the ranking of vulnerabilities based on their relevance within a specific context. The score is computed based on the contextualized CVSS score as a base score with additional metrics applied. These additional metrics are detailed in the priority sections of the vulnerability details chapters. A priority label is derived for each vulnerability indicating whether - due to an increased Priority Score - a timely treatment is due.
document.notice.prioritization.text.2=The Priority Score is a non-normalized, non-continuous metric. It is not capped in order to provide a relative measurement for ranking vulnerabilities applying a policy-driven prioritization.
document.notice.external.sources.title=External Vulnerability Sources
document.notice.external.sources.1=The <abbreviated-form keyref="nvd" /> is the primary data source for vulnerability information utilized. A vulnerable product is represented within NVD as <abbreviated-form keyref="cpe" />; an individual vulnerability as <abbreviated-form keyref="cve" />.
document.notice.external.sources.2=Advisory information is included from additional sources. These vary dependent on the product domain and target audience.
