inventory-statistics-vulnerability.statistics-preface=Die folgende Tabelle zeigt eine Statistik der identifizierten Schwachstellen. Die Schwachstellen werden mit ihrer ursprünglichen, unveränderten Severity in die Statistik aufgenommen.
inventory-statistics-vulnerability.statistics-for-vulnerability=Die folgende Tabelle zeigt eine Statistik der identifizierten Schwachstellen mit Hinweisen von $advisoryName. Die Schwachstellen werden mit ihrer ursprünglichen, unveränderten Severity in der Statistik berücksichtigt.
inventory-statistics-vulnerability.statistics-preface-modified=Die folgende Tabelle zeigt eine Statistik der identifizierten Schwachstellen. Die Schwachstellen werden mit ihrer angepassten Severity, sofern verfügbar, oder mit ihrer ursprünglichen, unveränderten Severity in der Statistik aufgenommen.
inventory-statistics-vulnerability.statistics-preface-modified-with-advisory=Die folgende Tabelle zeigt eine Statistik der identifizierten Schwachstellen mit Hinweisen von $advisoryName. Die Schwachstellen werden mit ihrer angepassten Severity, sofern verfügbar, oder mit ihrer ursprünglichen, unveränderten Severity in der Statistik aufgenommen.

