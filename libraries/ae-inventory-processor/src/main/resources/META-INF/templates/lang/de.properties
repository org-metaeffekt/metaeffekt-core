inventory-report-bom.bill-of-materials=In den folgenden Kapiteln werden die Bestandteile der Software zu $reportContext.getReportInventoryName()#if($reportContext.getReportInventoryVersion()) $report.xmlEscapeString($reportContext.getReportInventoryVersion())#end aufgeführt. Die Kapitel sind entsprechend der jeweiligen Artefakt-Typen organisiert.
inventory-report-bom.licensing=In der Lizenzübersicht werden die als verbindlich bewerteten Lizenzen für $reportContext.reportInventoryName zusammengefasst. Zu jeder Lizenz werden die Artefakte aufgelistet, die mit der Lizenz in Verbindung stehen.
inventory-report-bom.asset=Dieses Kapitel enthält die Bestandteile und Lizenzierungsinformationen für das Asset $reportContext.getReportInventoryName()#if($reportContext.getReportInventoryVersion()) $report.xmlEscapeString($reportContext.getReportInventoryVersion())#end.
