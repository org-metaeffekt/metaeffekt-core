# Purpose and Context --------------------------------------------------------------------------------------------------
document.context.intro.vulnerability.report=Dieser Bericht wendet kontextspezifische Bewertungsmetriken auf die identifizierten Schwachstellen an. In den folgenden Abschnitten werden wesentliche Details zur Unterstützung der vermittelten Bewertungsergebnisse bereitgestellt.
document.context.intro.periodic.report=Dieser Bericht wendet kontextspezifische Bewertungsmetriken auf die im relevanten Zeitraum identifizierten Schwachstellen an. In den folgenden Abschnitten werden wesentliche Details zur Unterstützung der vermittelten Bewertungsergebnisse bereitgestellt.
document.context.intro.summary.report=Dieser Bericht wendet kontextspezifische Bewertungsmetriken auf die im relevanten Zeitraum identifizierten Schwachstellen an. In den folgenden Abschnitten werden wesentliche Details zur Unterstützung der vermittelten Bewertungsergebnisse bereitgestellt.

document.purpose.intro.vulnerability=Dieser ${document.type} detailliert die identifizierten Schwachstellen mit den aktuell verfücgbaren Bewertungsinformationen. Die Schwachstellen werden aufgeführt, nach ihrem aktuellen Status organisiert und mit öffentlich verfügbaren sowie bewertungsbezogenen Details weiter beschrieben.
document.purpose.intro.periodic=Dieser ${document.type} bietet einen Überblick über Schwachstellen- und Sicherheitshinweisdaten, die in einem bestimmten Zeitraum hinzugefügt oder aktualisiert wurden. Er detailliert die Teilmenge der Schwachstellen, die von den Änderungen in diesem Zeitraum betroffen sind.
document.purpose.intro.summary=Dieser ${document.type} bietet einen Überblick über den Schwachstellenstatus in Form einer Zusammenfassung. Er liefert Statistiken zum aktuellen Bewertungsstatus.

# Notice ---------------------------------------------------------------------------------------------------------------
document.notice.title=Hinweis
document.notice.trademarks.title=Namen und Marken
document.notice.trademarks.text=Alle in dieser Dokumentation erwähnten Firmennamen, Organisationsnamen und Produktnamen dienen ausschließlich Identifikationszwecken. Eine Marke wird nur dann ausdrücklich als eingetragene oder nicht eingetragene Marke gekennzeichnet, wenn dies durch entsprechende Richtlinien oder Lizenzbedingungen erforderlich ist.
document.notice.external.materials.title=Externe Schwachstellen-Materialien
document.notice.external.materials.text.1=Materialien - einschließlich Daten, Inhalte und Referenzen -, die Schwachstelleninformationen aus externen Quellen abdecken, werden in dieser Dokumentation 'AS-IS' präsentiert. #[[${organization.name}]]# erhebt keinen Anspruch auf das Urheberrecht an den enthaltenen externen Materialien, noch haftet #[[${organization.name}]]# für die Richtigkeit und Vollständigkeit der präsentierten externen Materialien. Materialien aus externen Quellen sind hier nur zu Informationszwecken enthalten. #[[${organization.name}]]# ist nicht verantwortlich für die Verfügbarkeit und den Inhalt, die über externe Links bereitgestellt werden.
document.notice.tpc.vulnerabilities.title=Schwachstellen von Drittanbieter-Komponenten
document.notice.tpc.vulnerabilities.text=Die in diesem Dokument aufgeführten Schwachstellen sind in erster Linie Schwachstellen von Software- oder Hardwarekomponenten von Drittanbietern, die in Assets von #[[${organization.name}]]# enthalten oder in diese integriert sind. Die Tatsache, dass eine solche Komponente von einer bekannten Schwachstelle betroffen ist, bedeutet nicht zwangsläufig, dass Assets betroffen sind. Um die Relevanz und potenzielle Risiken zu bestimmen, werden Schwachstellen im Kontext der Assets, die die Komponenten verwenden oder integrieren, kategorisiert und bewertet.
document.notice.assessment.categories.title=Bewertungskategorien für Schwachstellen
document.notice.assessment.categories.intro=Dieser Bericht organisiert Schwachstellen in drei Bewertungskategorien:
document.notice.category.affected.title=Affected
document.notice.category.affected.desc=Diese Kategorie umfasst Schwachstellen, die bewertet wurden und als Schwachstellen identifiziert wurden, die ein oder mehrere Assets im Geltungsbereich betreffen.
document.notice.category.potentially.affected.title=Potentially Affected
document.notice.category.potentially.affected.desc=Schwachstellen, die noch nicht bewertet wurden, gelten als "Potentially Affected" (potenziell betroffen) für ein oder mehrere Assets im Geltungsbereich.
document.notice.category.not.affected.title=Not Affected
document.notice.category.not.affected.desc=Sofern eine Schwachstelle keine Auswirkungen auf die Assets im Geltungsbereich hat, wird die Schwachstelle als "Not Affected" (nicht betroffen) eingestuft.
document.notice.assessment.categories.outro=Diese Kategorien werden speziell in Statistiken und Zusammenfassungen verwendet.
document.notice.assessment.status.title=Status der Schwachstellenbewertung
document.notice.assessment.status.intro=Auf der individuellen Ebene einer Schwachstelle in einem spezifischen Nutzungs-, Integrations- und -Kontext kann der Status der Schwachstellenbewertung bestimmt werden:
document.notice.status.applicable.title=Applicable
document.notice.status.applicable.desc=Es wird festgestellt, dass eine Schwachstelle im Gültigkeitsbereich eines Assets enthalten und potenziell ausnutzbar ist. Insbesondere kann keine Begründung geliefert werden, dass die Schwachstelle nicht ausgenutzt werden kann.
document.notice.status.not.applicable.title=Not Applicable
document.notice.status.not.applicable.desc=Eine Schwachstelle gilt als "Not Applicable" (nicht anwendbar), falls Nachweise erbracht werden können, die die Schwachstelle im Kontext eines Assets entweder als nicht zugänglich oder als nicht erreichbar belegen. Insbesondere gelten Schwachstellen in Funktionen oder Schnittstellen, die nicht verwendet werden oder deaktiviert sind, als "Not Applicable".
document.notice.status.in.review.title=In Review
document.notice.status.in.review.desc=Eine Schwachstelle befindet sich "In Review" (in Prüfung), falls Bewertungsdetails unzureichend oder nicht verfügbar sind.
document.notice.status.insignificant.title=Insignificant
document.notice.status.insignificant.desc=Eine Schwachstelle wird als "Insignificant" (unbedeutend) angesehen, falls die ursprüngliche Severity einen vorbestimmten Wert nicht überschreitet oder eine Schwachstelle bewertet wurde und im gegebenen Kontext explizit als "Insignificant" markiert ist. Der Status unterstützt die Priorisierung von Bewertungen und bietet gleichzeitig einen umfassenden Überblick.
document.notice.status.void.title=Void
document.notice.status.void.desc=Schwachstellen mit Status "Void" (nichtig) sind Schwachstellen, die für andere Versionen der im Gültigkeitsbereich betrachteten Assets gemeldet und bewertet wurden. "Void" Schwachstellen betreffen Komponentenversionen, die nicht in der aktuellen Asset-Version enthalten sind. Die betroffenen Komponenten wurden entweder gepatcht oder sind in den aktuell bereitgestellten Assets nicht enthalten. Void Schwachstellen werden gemeldet, um die Kontinuität über den Lebenszyklus eines Produkts zu gewährleisten.
document.notice.assessment.steps.title=Schwachstellenbewertung
document.notice.assessment.steps.intro=Identifizierte Schwachstellen werden in sechs wesentlichen Schritten bewertet:
document.notice.assessment.step.1=Korrelationsüberprüfung - Die identifizierten Komponenten werden automatisch mit betroffenen Produkten korreliert. Die Korrelation kann falsch, unvollständig oder ungenau sein. Im Schritt der Korrelationsüberprüfung wird das automatisierte Mapping überprüft und verbessert. Basierend auf einer genauen Korrelation betroffener Produkte können Schwachstellen präziser abgefragt werden.
document.notice.assessment.step.2=Anwendbarkeitsprüfung - Abgefragte Schwachstellen werden auf Anwendbarkeit analysiert. Schwachstellen, die "Not Applicable" sind, werden unter Angabe einer entsprechenden Begründung dokumentiert. Darüber hinaus können Schwachstellen innerhalb der vorgegebenen Kategorien herabgestuft oder hochgestuft werden.
document.notice.assessment.step.3=Kontextbewertung - Die Schwachstellen werden im gegebenen Kontext neu bewertet. Anpassungen der CVSS-Umgebungsmetriken ermöglichen eine Neuberechnung der CVSS-Severity basierend auf dem gegebenen Kontext.
document.notice.assessment.step.4=Vermeidungsprüfung - Für anwendbare Schwachstellen werden Alternativen oder Upgrade-Optionen validiert. Wenn ein Defekt, der die Schwachstelle verursacht, durch eine neuere Version der Komponente behoben wird, werden die Update- oder Upgrade-Optionen innerhalb der aktuellen Entwicklungs- und Release-Zeitpläne evaluiert.
document.notice.assessment.step.5=Risikobewertung - Schwachstellen mit Status "Applicable", die nicht sofort durch Updates, Upgrades oder Austausch behoben werden können, werden bewertet, um das auferlegte Sicherheitsrisiko zu ermitteln. Das durch die Schwachstelle verursachte Risiko wird beschrieben, und Gegenmaßnahmen für das in Betrieb befindliche Asset werden bewertet und dokumentiert.
document.notice.assessment.step.6=Schwachstellenbehebung - Basierend auf den durchgeführten Bewertungen werden die Optionen für eine Behebung der Schwachstelle abgeleitet. Diese können je nach Art oder Auswirkung der Schwachstelle erheblich variieren.
document.notice.severity.metrics.title=Schweregrad-Metriken für Schwachstellen
document.notice.severity.metrics.1=Im Allgemeinen wird die Severity von Schwachstellen mithilfe des <abbreviated-form keyref="cvss"/>-Bewertungssystems gemessen. Derzeit werden zwei Versionen des CVSS-Bewertungssystems häufig angewendet und von der NVD unterstützt. Dieses Dokument verwendet sowohl CVSS-Version 2.0 als auch die CVSS-Versionen 3.x.
document.notice.severity.metrics.2=Falls ein CVSS-Vektor der Version 3.x verfügbar ist, verwenden alle Severity-Metriken diese Version. Wenn für eine Schwachstelle kein CVSS-Vektor der Version 3.x bereitgestellt wird, greifen die Severity-Metriken auf einen CVSS-Vektor der Version 2.0 zurück, falls verfügbar. Die resultierenden Metriken werden für die Berechnung von Werten, die Kategorisierung von Severities, die Sortierung und die grafische Darstellung verwendet.
document.notice.severity.metrics.3=Dieser Ansatz wird gewählt, da die CVSS-Version 3.x detailliertere und somit differenziertere Bewertungen ermöglicht.
document.notice.severity.metrics.4=Der Bericht verwendet das Standard-CVSS-Severityschema gemäß Definition in der CVSS 3.1-Spezifikation:
document.notice.severity.scheme.title=CVSS-Severityschema
document.notice.severity.table.header.1=Severity-Einstufung
document.notice.severity.table.header.2=CVSS-Wertebereich
document.notice.severity.table.header.3=Anmerkungen
document.notice.severity.none.title=None
document.notice.severity.none.remarks=In der CVSS 2.0-Spezifikation ist 0.0 in der Severity-Einstufung "Low" (niedrig) enthalten.
document.notice.severity.low.title=Low
document.notice.severity.medium.title=Medium
document.notice.severity.high.title=High
document.notice.severity.high.remarks=In der CVSS 2.0-Spezifikation existiert die Severity-Einstufung "Critical" (kritisch) nicht. CVSS-Werte von 7.0 bis 10.0 werden alle als "High" (hoch) eingestuft.
document.notice.severity.critical.title=Critical
document.notice.severity.critical.remarks=In der CVSS 2.0-Spezifikation existiert die Severity-Einstufung "Critical" (kritisch) nicht. CVSS-Werte von 7.0 bis 10.0 werden alle als "High" (hoch) eingestuft.
document.notice.prioritization.title=Priorisierung von Schwachstellen
document.notice.prioritization.text.1=Der Vulnerability Priority Score automatisiert das Ranking von Schwachstellen basierend auf ihrer Relevanz in einem bestimmten Kontext. Der Wert wird basierend auf dem kontextualisierten CVSS-Wert als Basiswert unter Anwendung zusätzlicher Metriken berechnet. Diese zusätzlichen Metriken werden in den Prioritätsabschnitten der Kapitel zu den Schwachstellen-Details aufgeführt. Für jede Schwachstelle wird ein Prioritätslabel abgeleitet, das anzeigt, ob - aufgrund eines erhöhten Prioritätswerts - eine zeitnahe Behandlung erforderlich ist.
document.notice.prioritization.text.2=Der Priority Score ist eine nicht normierte, nicht kontinuierliche Metrik. Er ist nicht begrenzt, um ein relatives Maß für das Ranking von Schwachstellen unter Anwendung einer richtliniengesteuerten Priorisierung bereitzustellen.
document.notice.external.sources.title=Externe Schwachstellen-Quellen
document.notice.external.sources.1=Die <abbreviated-form keyref="nvd" /> ist die primäre genutzte Datenquelle für Schwachstelleninformationen. Ein betroffenes Produkt wird in der NVD als <abbreviated-form keyref="cpe" /> dargestellt; eine einzelne Schwachstelle als <abbreviated-form keyref="cve" />.
document.notice.external.sources.2=Advisory-Informationen aus zusätzlichen Quellen sind enthalten. Diese variieren je nach Produktdomäne und Zielgruppe.
document.notice.copyright.title=Urheberrecht
document.notice.copyright.text=Diese Dokumentation ist urheberrechtlich geschützt {0}, {1}.
