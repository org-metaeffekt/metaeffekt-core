inventory-report-bom.license-notice=Die hier detaillierte Software beinhaltet
inventory-report-bom.component-license=Die vorliegenden Versionen von $report.xmlEscapeString($componentNotice.getComponentName()) unterliegen den Bestimmungen der $componentNotice.getLicense().
inventory-report-bom.component-with-no-licenses= Für $components.size() Komponenten konnte kein Bezug zur Lizenzierung hergestellt werden. Diese Komponenten werden nachfolgend aufgelistet.
