inventory-report-bom.license-variations=$report.xmlEscapeString($license) wird als Repräsentant für alle ähnlichen Lizenzen mit Variationen oder Modifikationen aufgeführt. In diesem Unterkapitel werden die unterschiedlichen Ausprägungen von $report.xmlEscapeString($license) separat dargestellt.
inventory-report-bom.different-effective-licenses=Dieses Kapitel stellt die Lizenzen dar, die als effektive und verbindliche Lizenzen im Zusammenhang mit der Software abgeleitet wurden. In der Tabelle #if (!$termsWithOptions.isEmpty()) <xref href="#tpc_license-summary-$reportContext.id/LicenseOptions" type="table">Lizenzoptionen$reportContext.withTitle()</xref> #else Lizenzoptionen$reportContext.withTitle() #end werden Auswahlmöglichkeiten für den Empfänger der Software dokumentiert. Die Tabelle <xref href="#tpc_license-summary-$reportContext.id/LicensesInEffect" type="table">Effektive Lizenzen</xref> beinhaltet einen Überblick der effektiven Lizenzen.
inventory-report-bom.different-effective-licenses-2=Es ist zu berücksichtigen, dass eine Komponente mehreren effektiven Lizenzen zugeordnet sein kann. Dabei werden die jeweiligen Einzellizenzen als effektive Lizenz geführt. Dies gilt ebenfalls für Einzellizenzen von Lizenzoptionen.
