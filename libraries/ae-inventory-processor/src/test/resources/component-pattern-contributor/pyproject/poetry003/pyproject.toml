[project]
name = "cycle-demo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    { include-group = "dev" },
]
dev = [
    "ruff",
    { include-group = "test" },
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"