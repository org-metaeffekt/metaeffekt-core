# Ant Style Patterns
excludes:
  # Starting with
  - "/root/**/.*"
  - "/root/**/.*/**/*"
  - "/root/**/.conf"
  - "/root/standalone.xml"
  - "/root/anaconda-ks.cfg"
  - "/root/hosts2"
  - "/root/keystore/**/*"
  - "/root/rhel-extractor-mod.sh"
  - "/root/bigfix/**/*"
  - "/var/lib/authselect/backups/**/*"
  - "/proc/**"
  - "/sys/**"
  - "/run/**"
  - "/snap/**"
  - "/etc/**/*"
  - "/boot/grub/**"
  - "/boot/**/*"
  - "/usr/share/mime/**"
  - "/usr/share/licenses/**"
  - "/usr/share/apparmor/**"
  - "/usr/share/x11/**"
  - "/usr/share/YaST2/**"
  - "/usr/lib64/ldscripts/**"
  - "/usr/share/bash/**"
  - "/usr/lib/systemd/**"
  - "/usr/lib/locale/**"
  - "/usr/share/doc/**"
  - "/usr/share/locale/**"
  - "/usr/share/emacs/**"
  - "/usr/share/kbd/keymaps/**"
  - "/usr/share/kbd/consolefonts/**"
  - "/usr/source/kernels/**/*"
  - "/usr/bin/wildfly_pass"
  - "/var/share/zsh/**"
  - "/var/share/vim/**"
  - "/var/log/**"
  - "/var/spool/**"
  - "/var/db/**/*"
  - "/var/lib/dnf/**/*"
  - "/var/lib/alternatives/**/*"
  - "/var/lib/rpm/**/*"
  - "/var/lib/rpm-state/**/*"
  - "/var/lib/samba/**/*"
  - "/var/lib/rsyslog/**/*"
  - "/var/lib/selinux/**/*"
  - "/var/lib/sss/**/*"
  - "/var/lib/systemd/**/*"
  - "/var/lib/loginsight-agent/**/*"
  - "/var/lib/NetworkManager/**/*"
  - "/var/lib/rhsm/**/*"
  - "/var/lib/mysql/**/*"
  - "/dev/shm/**/*"
  - "/tmp/sort*"
  - "/opt/standalone.xml"
  # Ending with
  - "/**/*.py"
  - "/**/*.pyc"
  - "/**/*.png"
  - "/**/*.map"
  - "/**/*.ts"
  - "/**/*.class"
  - "/**/build.xml"
  - "/**/*.log"
  - "/**/*.lock"
  - "/**/*.cache"
  - "/**/*.service"
  - "/**/*.allow"
  - "/**/*.uuid"
  - "/**/*.updated"
  - "/**/*.der"
  - "/**/*.pem"
  - "/**/*.p12"
  - "/**/*.jks"
  - "/**/*.key"
  - "/**/*.pub"
  - "/**/*.crt"
  - "/**/*.read"
  - "/**/*.write"
  - "/**/*.qid"
  - "/**/*.qtp"
  - "/**/.swagger-codegen-ignore"
  - "/**/.autorelabel"
  - "/haErrorLog.txt"
  # Containing
  - "/**/__pycache__/**"
  - "/**/.kube/cache/**"
  - "/**/.git/objects/**"
  - "/**/.jenkins/cache/**"
  - "/**/.kube/http-cache/**"
  - "/**/var/lib/dpkg/**"
  - "/**/cache/**/*"
  - "/**/ccache/**/*"
  - "/**/*.log.*"
  - "/**/log/**/*"
  - "/**/*.jks"

artifactIdToVersionMap:

unknownFilePatterns:
  # Ending with
  - "/**/*.dat"
  - "/**/*.py"
  - "/**/*.pyc"
  - "/**/*.c"
  - "/**/*.cpp"
  - "/**/*.h"
  - "/**/*.notzip"
  - "/**/*.ko"
  - "/**/*.go"
  - "/**/*.vmanifest"
  - "/**/*/Makefile"
  - "/**/*/makefile"