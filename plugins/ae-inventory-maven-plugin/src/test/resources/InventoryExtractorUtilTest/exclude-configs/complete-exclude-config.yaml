excludes:
  # Starting
  - "/proc/**"
  - "/sys/**"
  # Ending
  - "/**/*.py"
  - "/**/*.pyc"
  # Containing
  - "/**/__pycache__/**"
  - "/**/.kube/cache/**"


artifactIdToVersionMap:
